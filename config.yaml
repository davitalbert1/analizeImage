ocr_engine: "easyocr" # Motor de OCR: "easyocr" ou "tesseract"

# Idiomas do OCR (códigos ISO)
ocr_languages:
  - "pt"
  - "en"

# Modelo de IA para extração avançada
# Opções: "donut" (naver-clova-ix/donut-base) ou caminho local
vision_model: "naver-clova-ix/donut-base"

use_gpu: true # Usar GPU se disponível
pdf_dpi: 300 # DPI para conversão PDF → imagem
ocr_min_confidence: 0.3 # Confiança mínima do OCR (0.0 a 1.0)

# Parser de campos
field_parser:
  line_tolerance: 15 # Tolerância vertical para agrupar texto na mesma linha (pixels)
  min_label_value_gap: 30 # Gap mínimo horizontal para separar label de valor (pixels)
  # Padrões de separador label:valor
  separators:
    - ":"
    - "="
    - " - "

# Configuração de treinamento
training:
  model_name: "naver-clova-ix/donut-base"
  output_dir: "./trained_model"
  epochs: 5
  batch_size: 1
  gradient_accumulation_steps: 4
  max_steps_per_epoch: 500 # 500 steps por época (~9 min), 0 = sem limite (toda a época)
  learning_rate: 5.0e-5
  max_length: 512
  image_size: [1280, 960]
  warmup_steps: 100
  save_steps: 500
  eval_steps: 500
